<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colabre — Colaboração comunitária</title>
<meta name="description" content="Conectamos pessoas para compartilhar habilidades, oferecer ajuda e transformar pequenas contribuições em grandes mudanças.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="css/styles.css?v=14">
<link rel="stylesheet" href="css/responsive.css?v=14">
</head>
<body>
<div id="root"><div style="padding:32px;font-family:system-ui,sans-serif;text-align:center"><h1 style="color:#3D5145">Colabre</h1><p style="color:#77736F">Carregando plataforma…</p><noscript><p>Ative o JavaScript para usar o Colabre.</p></noscript></div></div>

<div class="modal-wrap" id="modal" role="dialog" aria-modal="true">
  <div class="modal" id="modal-box">
    <h2 id="modal-title"></h2>
    <p id="modal-message" class="text-muted" style="margin:8px 0 16px"></p>
    <div class="inline" style="justify-content:flex-end">
      <button class="btn btn-outline" id="modal-cancel">Cancelar</button>
      <button class="btn btn-accent" id="modal-confirm">Confirmar</button>
    </div>
  </div>
</div>

<div class="modal-wrap" id="update-modal" role="dialog" aria-modal="true" aria-labelledby="update-modal-title">
  <div class="modal modal-wide">
    <h2 id="update-modal-title">Registrar atualização do projeto</h2>
    <p id="update-modal-project" class="text-muted" style="margin:8px 0 16px"></p>
    <div class="field">
      <label for="update-text">O que aconteceu? *</label>
      <textarea id="update-text" placeholder="Ex.: O mutirão de sábado reuniu 12 pessoas e plantamos 30 mudas."></textarea>
    </div>
    <div class="field">
      <label for="update-hours">Horas confirmadas nesta etapa</label>
      <input id="update-hours" class="input" type="number" min="0" step="0.5" value="0" inputmode="decimal">
      <p class="kv" id="update-preview" style="margin-top:6px"></p>
    </div>
    <p class="error" id="update-error"></p>
    <div class="inline" style="justify-content:flex-end;margin-top:14px">
      <button class="btn btn-outline" id="update-cancel" type="button">Cancelar</button>
      <button class="btn btn-accent" id="update-save" type="button">Registrar atualização</button>
    </div>
  </div>
</div>
<div class="modal-wrap" id="contest-modal" role="dialog" aria-modal="true" aria-labelledby="contest-modal-title">
  <div class="modal">
    <h2 id="contest-modal-title">Contestar tempo</h2>
    <p class="text-muted" style="margin:8px 0 16px">Informe o tempo que você reconhece e o motivo. Os créditos ficam bloqueados até a resolução.</p>
    <div class="field">
      <label for="contest-hours">Tempo reconhecido (horas)</label>
      <input id="contest-hours" class="input" type="number" min="0.25" step="0.25" inputmode="decimal">
      <p class="kv">1 hora = 1 crédito · 15 min = 0,25 · 30 min = 0,5 · 45 min = 0,75</p>
    </div>
    <div class="field">
      <label for="contest-reason">Motivo da contestação *</label>
      <textarea id="contest-reason" placeholder="Explique o que divergiu do tempo registrado."></textarea>
    </div>
    <p class="error" id="contest-error"></p>
    <div class="inline" style="justify-content:flex-end;margin-top:14px">
      <button class="btn btn-outline" id="contest-cancel" type="button">Cancelar</button>
      <button class="btn btn-accent" id="contest-save" type="button">Registrar contestação</button>
    </div>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>

<script src="js/config.js"></script>\n<script type="module" src="js/app.js?v=22"></script>
</body>
</html>
