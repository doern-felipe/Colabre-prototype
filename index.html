<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colabre — Colaboração comunitária</title>
<meta name="description" content="Conectamos pessoas para compartilhar habilidades, oferecer ajuda e transformar pequenas contribuições em grandes mudanças.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="root"><div style="padding:32px;font-family:system-ui,sans-serif;text-align:center"><h1 style="color:#3D5145">O Tempo Vale</h1><p style="color:#77736F">Carregando plataforma…</p><noscript><p>Ative o JavaScript para usar o O Tempo Vale.</p></noscript></div></div>

<div class="modal-wrap" id="modal" role="dialog" aria-modal="true">
  <div class="modal" id="modal-box">
    <h2 id="modal-title"></h2>
    <p id="modal-message" class="text-muted" style="margin:8px 0 16px"></p>
    <div class="inline" style="justify-content:flex-end">
      <button class="btn btn-outline" id="modal-cancel">Cancelar</button>
      <button class="btn btn-accent" id="modal-confirm">Confirmar</button>
    </div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<script>
window.onerror = function(m){
  var r = document.getElementById('root');
  if(r && !r.dataset.ready){ r.innerHTML = '<div style="padding:32px;font-family:system-ui,sans-serif;max-width:560px;margin:0 auto"><h2 style="color:#3D5145">O Tempo Vale</h2><p>Não foi possível carregar a plataforma. Confira o console (F12) e recarregue a página. Se abriu o arquivo direto, rode <code>python -m http.server 8080</code> na pasta e acesse http://localhost:8080</p></div>'; }
};
</script>
<script src="js/bundle.js"></script>
</body>
</html>
